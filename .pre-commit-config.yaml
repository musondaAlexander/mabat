# Mirrors scripts/check.py. Fast formatting/lint checks run on every commit; the full
# gates (mypy + pytest, ~45 s) run before a push so a red commit never leaves the machine.
#
#   pip install pre-commit
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# Both hooks go through scripts/check.py, which re-runs itself with the repository venv
# when the caller (a GUI's git, a bare shell) does not have it on PATH.
repos:
  - repo: local
    hooks:
      - id: quick
        name: ruff format + check (autofix)
        entry: python scripts/check.py --quick
        language: system
        types: [python]
      - id: gates
        name: quality gates (format, lint, mypy, pytest)
        entry: python scripts/check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
