name: publish

# Builds and publishes to PyPI when a version tag is pushed (v0.1.0, v1.2.3 ...).
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere. One-time setup on
# pypi.org -> your project -> Publishing -> add GitHub publisher:
#   owner musondaAlexander, repository mabat, workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gates
        run: |
          python -m pip install -e ".[all,dev]"
          python scripts/check.py
      - name: Tag matches pyproject version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version, f"tag v{tag} != pyproject version {version}"
          PY
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
