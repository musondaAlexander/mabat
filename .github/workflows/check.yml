name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all,dev]" -e packages/mabat-api -e packages/mabat-ui
      - name: Quality gates
        run: python scripts/check.py
      - name: Health (smoke)
        run: mabat health
      - name: Snapshot (smoke)
        run: mabat snapshot --json --skip system > snapshot.json && python -c "import json; json.load(open('snapshot.json'))"
