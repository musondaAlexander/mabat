# Built-in defaults for mabat. Override any value with a `mabat.toml` in the working
# directory, a file named by $MABAT_CONFIG, or a path passed to load_settings().
# Vocabulary and tunables live here - in data - not in source.

[sampling]
# seconds psutil samples CPU utilisation over; 0 returns the delta since the last call
cpu_sample_seconds = 0.5

[processes]
# how many processes the system section lists, ranked by CPU then memory
top_n = 10
# seconds per-process CPU usage is sampled over (0 = delta since the previous call)
sample_seconds = 0.5
# process names left out of the ranking (exact match); pseudo-processes, not real work
hidden_names = ["System Idle Process"]

[thresholds]
# utilisation levels (percent) the CLI colours as warning / critical
warn_percent = 80.0
critical_percent = 95.0
# temperatures (Celsius) coloured as warning / critical when a sensor gives no limits of its own
temperature_warn_c = 75.0
temperature_critical_c = 90.0

[network]
# fnmatch patterns; matching interfaces are collapsed in the CLI view (always in the data)
hidden_interface_patterns = ["Loopback*", "lo"]
# address the outbound-IP probe "connects" a UDP socket to; no packet is ever sent
probe_address = "8.8.8.8"

[redaction]
# field names whose string values `--redact` / mabat.redact() replace with "[redacted]"
# before a snapshot is shared: identity, addresses and serials
keys = [
  "hostname", "username", "host", "outbound_ip", "public_ip",
  "address", "local_address", "remote_address",
  "serial", "uuid",
]
