[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "mabat"
version = "0.1.0"
description = "Observe your machine - CPU, GPU, memory, storage, network and OS - as plain Python data, a CLI, or an API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Musonda" }]
maintainers = [{ name = "Alexander Musonda" }]
requires-python = ">=3.12"
keywords = [
    "system-monitor", "hardware", "cpu", "gpu", "memory", "disk", "network", "sensors",
    "psutil", "nvml", "cli", "observability", "dashboard", "fastapi", "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=7",
    "py-cpuinfo>=9",
]

[project.urls]
Homepage = "https://github.com/musondaAlexander/mabat"
Documentation = "https://github.com/musondaAlexander/mabat#readme"
Runbook = "https://github.com/musondaAlexander/mabat/blob/main/RUNBOOK.md"
Changelog = "https://github.com/musondaAlexander/mabat/blob/main/CHANGELOG.md"
Repository = "https://github.com/musondaAlexander/mabat.git"
Issues = "https://github.com/musondaAlexander/mabat/issues"

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13", "prompt_toolkit>=3.0"]
gpu = ["nvidia-ml-py>=12"]
smart = ["pySMART>=1.3"]
speedtest = ["speedtest-cli>=2.1"]
all = ["mabat[cli,gpu,smart,speedtest]"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "types-psutil",
    # the companion packages under packages/ and their test clients
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.48",
    "pandas>=2",
    "pre-commit>=3.7",
]

[project.scripts]
mabat = "mabat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mabat = ["_shared/defaults.toml", "py.typed"]

# --- formatter + static analysis -------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "S",        # bandit: flags subprocess/shell use so it stays confined to _shared/platform.py
    "T20",      # no stray print() in library code
]

[tool.ruff.lint.per-file-ignores]
"src/mabat/_shared/platform.py" = ["S603", "S607"]  # the one sanctioned subprocess site
"src/mabat/cli/**" = ["T20"]                        # the CLI is allowed to print
"tests/**" = ["S101", "S603", "S607", "T20"]        # asserts and helper commands in tests
"packages/**/tests/**" = ["S101", "T20"]
"scripts/**" = ["S603", "S607", "T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts", "packages/mabat-api/src", "packages/mabat-ui/src"]
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src:packages/mabat-api/src:packages/mabat-ui/src"

[[tool.mypy.overrides]]
module = ["cpuinfo", "pynvml", "pySMART", "pySMART.*", "speedtest", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/mabat-api/tests", "packages/mabat-ui/tests"]
addopts = "-q --strict-markers"
markers = [
    "guard: release-blocking guard test (owned by the user; do not weaken without sign-off)",
]
