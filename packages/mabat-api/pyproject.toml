[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mabat-api"
version = "0.1.0"
description = "HTTP API for mabat: your machine's CPU, GPU, memory, storage, network and OS as JSON."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexander Musonda" }]
requires-python = ">=3.12"
keywords = ["mabat", "fastapi", "system-monitor", "hardware", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mabat>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
mabat-api = "mabat_api.__main__:main"

[project.urls]
Homepage = "https://github.com/musondaAlexander/mabat"
Repository = "https://github.com/musondaAlexander/mabat.git"

[tool.setuptools.packages.find]
where = ["src"]
