[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mabat-ui"
version = "0.1.0"
description = "A live Streamlit dashboard for mabat: your machine's CPU, GPU, memory, storage, network and OS."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alexander Musonda" }]
requires-python = ">=3.12"
keywords = ["mabat", "streamlit", "dashboard", "system-monitor", "hardware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "mabat>=0.1.0",
    "streamlit>=1.35",
    "pandas>=2",
]

[project.scripts]
mabat-ui = "mabat_ui:main"

[project.urls]
Homepage = "https://github.com/musondaAlexander/mabat"
Repository = "https://github.com/musondaAlexander/mabat.git"

[tool.setuptools.packages.find]
where = ["src"]
